<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی کلینیک ایمپلنتکده</title>
    <!-- اضافه کردن فونت وزیر برای نمایش بهتر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <style>
        /* ریست کامل استایل‌ها برای جلوگیری از تداخل */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Vazirmatn', Tahoma, sans-serif; }
        
        #panorama { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* استایل اختصاصی هات‌اسپات‌ها - بدون انیمیشن‌های مزاحم */
        .pnlm-hotspot-base { cursor: pointer; transition: transform 0.2s ease; }
        .pnlm-hotspot-base:hover { transform: scale(1.15); }
        
        /* دکمه آبی استاندارد */
        .hotspot-blue {
            width: 50px; height: 50px;
            background: rgba(2, 119, 189, 0.9);
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px;
        }
        
        /* دکمه سبز مشاوره */
        .hotspot-green {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, #43a047, #2e7d32);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.8);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 28px;
            animation: gentlePulse 2s infinite;
        }
        
        @keyframes gentlePulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        /* تولتیپ فارسی */
        .pnlm-tooltip span {
            background: rgba(0,0,0,0.85); color: white;
            padding: 8px 15px; border-radius: 8px;
            font-size: 14px; border: none; white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        /* المان‌های ثابت UI (خارج از تور) */
        .ui-layer { position: fixed; z-index: 1000; pointer-events: auto; }
        
        .top-right-link {
            top: 20px; right: 20px;
            background: linear-gradient(135deg, #0277bd, #01579b);
            color: white; padding: 12px 25px; border-radius: 30px;
            text-decoration: none; font-weight: bold; font-size: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 8px;
        }

        .gps-btn {
            top: 20px; left: 20px;
            background: white; color: #333;
            padding: 10px 20px; border-radius: 30px;
            border: none; font-family: inherit; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 6px;
        }

        .back-btn {
            bottom: 20px; left: 20px;
            background: rgba(255,255,255,0.9); color: #333;
            padding: 10px 20px; border-radius: 30px;
            border: none; font-family: inherit; font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none; /* پیش‌فرض مخفی */
        }

        .sound-toggle {
            bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.6); color: white;
            padding: 10px 15px; border-radius: 50%;
            border: none; font-size: 20px;
            backdrop-filter: blur(5px);
        }

        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #01579b; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- صفحه لودینگ -->
<div class="loading-screen" id="loader">
    <div class="spinner"></div>
    <div>در حال بارگذاری تور مجازی...</div>
</div>

<!-- رابط کاربری ثابت -->
<a href="https://dibaads.com/" target="_blank" class="ui-layer top-right-link"> وبسایت ایمپلنتکده</a>
<button onclick="openGPS()" class="ui-layer gps-btn">📍 میدان ملت (GPS)</button>
<button onclick="goBack()" id="backBtn" class="ui-layer back-btn">⬅ بازگشت به شروع</button>
<button onclick="toggleAudio()" id="audioBtn" class="ui-layer sound-toggle">🔇</button>

<!-- کانتینر تور -->
<div id="panorama"></div>

<!-- فایل صوتی -->
<audio id="bgMusic" loop><source src="piano.mp3" type="audio/mpeg"></audio>

<script>
// --- تنظیمات لینک‌ها ---
const LAND_URL = "https://dibaads.com/cooperation/#contact";
const SITE_URL = "https://dibaads.com/";
// مختصات ضلع جنوبی میدان ملت، شمس‌آباد
const GPS_LAT = 35.5689; 
const GPS_LNG = 51.3456; 

let isAudioPlaying = false;
const audio = document.getElementById('bgMusic');
audio.volume = 0.2;

// --- توابع رابط کاربری ---
function openGPS() {
    window.open(`https://www.google.com/maps?q=${GPS_LAT},${GPS_LNG}&z=17`, '_blank');
}

function toggleAudio() {
    const btn = document.getElementById('audioBtn');
    if(isAudioPlaying) {
        audio.pause();
        btn.textContent = '🔇';
    } else {
        audio.play().catch(e => console.log("Audio play failed:", e));
        btn.textContent = '🔊';
    }
    isAudioPlaying = !isAudioPlaying;
}

function goBack() {
    viewer.loadScene('meydan-mellat');
}

// فعال‌سازی صدا با اولین کلیک کاربر (قانون مرورگرها)
document.body.addEventListener('click', () => {
    if(!isAudioPlaying && audio.paused) {
        // اختیاری: اگر می‌خواهید با اولین کلیک هر جایی صدا پخش شود
        // toggleAudio(); 
    }
}, {once:true});


// --- راه‌اندازی Pannellum ---
const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "meydan-mellat",
        "sceneFadeDuration": 1000,
        "autoLoad": true,
        "showControls": true,
        "mouseZoom": true,
        "draggable": true,
        "friction": 0.1
    },
    "scenes": {
        // 1. میدان ملت
        "meydan-mellat": {
            "title": "میدان ملت",
            "type": "equirectangular",
            "panorama": "meydan-mellat.jpg",
            "hotSpots": [
                { "pitch": -5, "yaw": 0, "type": "scene", "text": "🚪 ورود به کلینیک", "sceneId": "voroodi", "cssClass": "hotspot-blue" },
                { "pitch": 5, "yaw": 90, "type": "scene", "text": "🛋️ پذیرش", "sceneId": "paziresh", "cssClass": "hotspot-blue" }
            ]
        },
        // 2. ورودی کلینیک
        "voroodi": {
            "title": "ورودی",
            "type": "equirectangular",
            "panorama": "voroodi.jpg",
            "hotSpots": [
                { "pitch": 0, "yaw": 180, "type": "scene", "text": "🔙 بازگشت به میدان", "sceneId": "meydan-mellat", "cssClass": "hotspot-blue" },
                { "pitch": -5, "yaw": 0, "type": "scene", "text": "🛋️ رفتن به پذیرش", "sceneId": "paziresh", "cssClass": "hotspot-blue" },
                { "pitch": 5, "yaw": -90, "type": "scene", "text": "🦷 اتاق درمان", "sceneId": "younit", "cssClass": "hotspot-blue" }
            ]
        },
        // 3. پذیرش
        "paziresh": {
            "title": "پذیرش",
            "type": "equirectangular",
            "panorama": "paziresh.jpg",
            "hotSpots": [
                { "pitch": 0, "yaw": 180, "type": "scene", "text": "🔙 بازگشت به میدان", "sceneId": "meydan-mellat", "cssClass": "hotspot-blue" },
                { "pitch": -5, "yaw": 0, "type": "scene", "text": "🦷 اتاق درمان", "sceneId": "younit", "cssClass": "hotspot-blue" },
                // دکمه ویژه مشاوره
                { "pitch": 0, "yaw": 90, "type": "info", "text": "💬 مشاوره رایگان", "cssClass": "hotspot-green", 
                  "clickHandlerFunc": function() { window.open(LAND_URL, '_blank'); } 
                }
            ]
        },
        // 4. اتاق یونیت
        "younit": {
            "title": "اتاق درمان",
            "type": "equirectangular",
            "panorama": "younit.jpg",
            "hotSpots": [
                { "pitch": 0, "yaw": 180, "type": "scene", "text": "🔙 بازگشت به پذیرش", "sceneId": "paziresh", "cssClass": "hotspot-blue" },
                { "pitch": 5, "yaw": 90, "type": "scene", "text": " خروجی", "sceneId": "voroodi", "cssClass": "hotspot-blue" }
            ]
        }
    }
});

// مدیریت نمایش دکمه بازگشت
viewer.on('scenechange', function(sceneId) {
    const backBtn = document.getElementById('backBtn');
    if(sceneId === 'meydan-mellat') {
        backBtn.style.display = 'none';
    } else {
        backBtn.style.display = 'block';
    }
});

// حذف صفحه لودینگ پس از بارگذاری
viewer.on('load', function() {
    document.getElementById('loader').style.opacity = '0';
    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500);
});

</script>
</body>
</html>
