<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی 360° کلینیک ایمپلنتکده</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Tahoma, sans-serif; 
            overflow: hidden; 
            background: #000;
        }
        #panorama { 
            width: 100vw; 
            height: 100vh;
        }
        
        .custom-hotspot {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #4fc3f7 0%, #0277bd 100%);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.9);
            cursor: pointer;
        }
        
        .consult-hotspot {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #66bb6a 0%, #2e7d32 100%);
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 25px rgba(102, 187, 106, 1);
            cursor: pointer;
        }
        
        .pnlm-tooltip span {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: Tahoma;
            font-size: 14px;
            direction: rtl;
        }
        
        /* دکمه‌های ثابت با z-index بالا */
        .fixed-btn {
            position: fixed;
            z-index: 9999;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .scene-title {
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, rgba(2, 119, 189, 0.95), rgba(0, 77, 128, 0.95));
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 15px;
            border: none;
        }
        
        .gps-btn {
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.95);
            border: none;
            padding: 12px 18px;
            border-radius: 25px;
            font-family: Tahoma;
            font-size: 13px;
            color: #333;
        }
        
        .back-btn {
            top: 70px;
            left: 15px;
            background: rgba(255,255,255,0.95);
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-family: Tahoma;
            font-size: 13px;
            color: #333;
            display: none;
        }
        
        .logo {
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #0277bd, #01579b);
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
        }
        
        .sound-control {
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-family: Tahoma;
            font-size: 13px;
            border: none;
        }
        
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0277bd, #01579b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
        }
        .loading-spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>در حال بارگذاری...</div>
</div>

<a href="https://dibaads.com/" target="_blank" class="fixed-btn scene-title" id="sceneTitle">🦷 ایمپلنتکده</a>

<button class="fixed-btn gps-btn" id="gpsBtn">
    <span>📍</span>
    <span>میدان ملت</span>
</button>

<button class="fixed-btn back-btn" id="backBtn">← بازگشت</button>

<a href="https://dibaads.com/" target="_blank" class="fixed-btn logo">🦷 ایمپلنتکده</a>

<button class="fixed-btn sound-control" id="soundBtn">
    <span id="soundIcon">🔊</span>
    <span id="soundText">صدا</span>
</button>

<div id="panorama"></div>
<audio id="pianoMusic" loop><source src="piano.mp3" type="audio/mpeg"></audio>

<script>
let soundEnabled = true;
let audioStarted = false;

function playWhoosh() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const duration = 0.5;
        const buffer = ctx.createBuffer(2, ctx.sampleRate * duration, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
            const data = buffer.getChannelData(ch);
            for (let i = 0; i < buffer.length; i++) {
                const t = i / buffer.length;
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3) * 0.8;
            }
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + duration);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        source.connect(filter).connect(gain).connect(ctx.destination);
        source.start();
    } catch(e) {}
}

const pianoMusic = document.getElementById('pianoMusic');
pianoMusic.volume = 0.15;

// دکمه صدا
document.getElementById('soundBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
        pianoMusic.play().catch(()=>{});
        document.getElementById('soundIcon').textContent = '🔊';
        document.getElementById('soundText').textContent = 'صدا';
    } else {
        pianoMusic.pause();
        document.getElementById('soundIcon').textContent = '🔇';
        document.getElementById('soundText').textContent = 'بی‌صدا';
    }
});

// دکمه GPS
document.getElementById('gpsBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    playWhoosh();
    const lat = 35.5689;
    const lng = 51.3456;
    window.open(`https://www.google.com/maps?q=${lat},${lng}&z=17`, '_blank');
});

// دکمه بازگشت
document.getElementById('backBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    viewer.loadScene('meydan-mellat');
});

// شروع صدا با اولین کلیک روی panorama
document.getElementById('panorama').addEventListener('click', function() {
    if (soundEnabled && !audioStarted) {
        pianoMusic.play().catch(()=>{});
        audioStarted = true;
    }
}, { once: true });

function openLandingPage() {
    playWhoosh();
    window.open('https://dibaads.com/cooperation/#contact', '_blank');
}

const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "meydan-mellat",
        "sceneFadeDuration": 800,
        "autoLoad": true,
        "showControls": true,
        "hfov": 100
    },
    "scenes": {
        "meydan-mellat": {
            "title": "میدان ملت",
            "type": "equirectangular",
            "panorama": "meydan-mellat.jpg",
            "hotSpots": [
                {
                    "pitch": -5,
                    "yaw": 0,
                    "type": "scene",
                    "text": "🚪 ورود به ایمپلنتکده",
                    "sceneId": "voroodi",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": 5,
                    "yaw": 90,
                    "type": "scene",
                    "text": "🛋️ پذیرش",
                    "sceneId": "paziresh",
                    "cssClass": "custom-hotspot"
                }
            ]
        },
        "voroodi": {
            "title": "ورودی ایمپلنتکده",
            "type": "equirectangular",
            "panorama": "voroodi.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 180,
                    "type": "scene",
                    "text": "🔙 بازگشت به میدان",
                    "sceneId": "meydan-mellat",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": -5,
                    "yaw": 0,
                    "type": "scene",
                    "text": "🛋️ پذیرش",
                    "sceneId": "paziresh",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": 5,
                    "yaw": -90,
                    "type": "scene",
                    "text": "🦷 اتاق یونیت",
                    "sceneId": "younit",
                    "cssClass": "custom-hotspot"
                }
            ]
        },
        "paziresh": {
            "title": "پذیرش",
            "type": "equirectangular",
            "panorama": "paziresh.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 180,
                    "type": "scene",
                    "text": "🔙 میدان ملت",
                    "sceneId": "meydan-mellat",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": -5,
                    "yaw": 0,
                    "type": "scene",
                    "text": "🦷 اتاق یونیت",
                    "sceneId": "younit",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": 0,
                    "yaw": 90,
                    "type": "info",
                    "text": "مشاوره رایگان",
                    "cssClass": "consult-hotspot",
                    "clickHandlerFunc": openLandingPage
                }
            ]
        },
        "younit": {
            "title": "اتاق یونیت",
            "type": "equirectangular",
            "panorama": "younit.jpg",
            "hotSpots": [
                {
                    "pitch": 0,
                    "yaw": 180,
                    "type": "scene",
                    "text": " پذیرش",
                    "sceneId": "paziresh",
                    "cssClass": "custom-hotspot"
                },
                {
                    "pitch": 5,
                    "yaw": 90,
                    "type": "scene",
                    "text": "🚪 ورودی",
                    "sceneId": "voroodi",
                    "cssClass": "custom-hotspot"
                }
            ]
        }
    }
});

viewer.on('scenechange', function(sceneId) {
    document.getElementById('backBtn').style.display = sceneId !== 'meydan-mellat' ? 'flex' : 'none';
});

viewer.on('load', function() {
    document.getElementById('loading').style.display = 'none';
});
</script>

</body>
</html>
