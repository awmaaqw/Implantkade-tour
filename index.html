<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تور مجازی 360° کلینیک ایمپلنتکده</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Vazirmatn', Tahoma, sans-serif; 
            overflow: hidden; 
            background: #000;
            -webkit-tap-highlight-color: transparent;
        }
        #panorama { width: 100vw; height: 100vh; }
        
        /* ===== دکمه‌های نئونی با نام ثابت ===== */
        .neon-hotspot {
            position: relative;
            width: auto !important;
            height: auto !important;
            min-width: 100px;
            padding: 10px 18px;
            background: rgba(10, 30, 60, 0.8);
            border: 2px solid #4fc3f7;
            border-radius: 25px;
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 
                0 0 8px rgba(79, 195, 247, 0.6),
                0 0 20px rgba(79, 195, 247, 0.3),
                inset 0 0 10px rgba(79, 195, 247, 0.2);
            text-shadow: 0 0 8px rgba(79, 195, 247, 0.8);
            animation: neonPulse 2.5s ease-in-out infinite;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        
        /* افکت کلیک/تاچ */
        .neon-hotspot:active,
        .neon-hotspot.touch-active {
            transform: scale(0.92);
            background: rgba(79, 195, 247, 0.4);
            box-shadow: 
                0 0 20px rgba(79, 195, 247, 1),
                0 0 40px rgba(79, 195, 247, 0.6),
                inset 0 0 20px rgba(79, 195, 247, 0.5);
        }
        
        @keyframes neonPulse {
            0%, 100% {
                box-shadow: 
                    0 0 6px rgba(79, 195, 247, 0.5),
                    0 0 15px rgba(79, 195, 247, 0.25),
                    inset 0 0 8px rgba(79, 195, 247, 0.15);
            }
            50% {
                box-shadow: 
                    0 0 10px rgba(79, 195, 247, 0.7),
                    0 0 25px rgba(79, 195, 247, 0.35),
                    inset 0 0 12px rgba(79, 195, 247, 0.25);
            }
        }
        
        /* دکمه مشاوره سبز */
        .neon-hotspot.consult {
            border-color: #66bb6a;
            background: rgba(10, 50, 30, 0.8);
            box-shadow: 
                0 0 8px rgba(102, 187, 106, 0.6),
                0 0 20px rgba(102, 187, 106, 0.3),
                inset 0 0 10px rgba(102, 187, 106, 0.2);
            text-shadow: 0 0 8px rgba(102, 187, 106, 0.8);
            animation: neonPulseGreen 2s ease-in-out infinite;
        }
        
        .neon-hotspot.consult:active,
        .neon-hotspot.consult.touch-active {
            background: rgba(102, 187, 106, 0.4);
            box-shadow: 
                0 0 20px rgba(102, 187, 106, 1),
                0 0 40px rgba(102, 187, 106, 0.6),
                inset 0 0 20px rgba(102, 187, 106, 0.5);
        }
        
        @keyframes neonPulseGreen {
            0%, 100% {
                box-shadow: 
                    0 0 6px rgba(102, 187, 106, 0.5),
                    0 0 15px rgba(102, 187, 106, 0.25),
                    inset 0 0 8px rgba(102, 187, 106, 0.15);
            }
            50% {
                box-shadow: 
                    0 0 12px rgba(102, 187, 106, 0.8),
                    0 0 30px rgba(102, 187, 106, 0.4),
                    inset 0 0 14px rgba(102, 187, 106, 0.3);
            }
        }
        
        /* نمایش دائمی tooltip (نام دکمه) */
        .pnlm-hotspot.pnlm-info .pnlm-tooltip,
        .pnlm-hotspot.pnlm-scene .pnlm-tooltip {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: none;
        }
        
        .pnlm-tooltip span {
            background: rgba(10, 30, 60, 0.85) !important;
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 20px !important;
            font-family: 'Vazirmatn', sans-serif !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            direction: rtl;
            border: 2px solid #4fc3f7 !important;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.5) !important;
            text-shadow: 0 0 6px rgba(79, 195, 247, 0.8);
            white-space: nowrap;
        }
        
        .pnlm-hotspot.pnlm-info.consult .pnlm-tooltip span {
            border-color: #66bb6a !important;
            box-shadow: 0 0 15px rgba(102, 187, 106, 0.5) !important;
            text-shadow: 0 0 6px rgba(102, 187, 106, 0.8);
        }
        
        /* دکمه‌های ثابت */
        .fixed-btn {
            position: fixed;
            z-index: 9999;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Vazirmatn', sans-serif;
            border: none;
        }
        
        .scene-title {
            top: 15px; right: 15px;
            background: linear-gradient(135deg, rgba(2, 119, 189, 0.95), rgba(0, 77, 128, 0.95));
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(2, 119, 189, 0.5);
        }
        
        .gps-btn {
            top: 15px; left: 15px;
            background: rgba(255,255,255,0.95);
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .back-btn {
            top: 70px; left: 15px;
            background: rgba(255,255,255,0.95);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            color: #333;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .logo {
            bottom: 20px; right: 20px;
            background: linear-gradient(135deg, #0277bd, #01579b);
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 900;
            box-shadow: 0 4px 20px rgba(2, 119, 189, 0.6);
        }
        
        .sound-control {
            bottom: 20px; left: 20px;
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }
        
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0277bd, #01579b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            color: white;
            font-family: 'Vazirmatn', sans-serif;
        }
        .loading-spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .transition-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 9998;
            transition: opacity 0.6s ease-in-out;
        }
        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div>در حال بارگذاری...</div>
</div>

<div class="transition-overlay" id="transitionOverlay"></div>

<a href="https://dibaads.com/" target="_blank" class="fixed-btn scene-title">🦷 ایمپلنتکده</a>

<button class="fixed-btn gps-btn" id="gpsBtn">
    <span>📍</span>
    <span>میدان ملت</span>
</button>

<button class="fixed-btn back-btn" id="backBtn">← بازگشت</button>

<a href="https://dibaads.com/" target="_blank" class="fixed-btn logo">🦷 ایمپلنتکده</a>

<button class="fixed-btn sound-control" id="soundBtn">
    <span id="soundIcon">🔊</span>
    <span id="soundText">صدا</span>
</button>

<div id="panorama"></div>
<audio id="pianoMusic" loop><source src="piano.mp3" type="audio/mpeg"></audio>

<script>
let soundEnabled = true;
let audioStarted = false;
let isTransitioning = false;

const GPS_LAT = 35.5689;
const GPS_LNG = 51.3456;

// ===== افکت Whoosh =====
function playWhoosh() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const duration = 0.7;
        const buffer = ctx.createBuffer(2, ctx.sampleRate * duration, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
            const data = buffer.getChannelData(ch);
            for (let i = 0; i < buffer.length; i++) {
                const t = i / buffer.length;
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5) * 0.8;
            }
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 1.5;
        filter.frequency.setValueAtTime(5000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + duration);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.7, ctx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        source.connect(filter).connect(gain).connect(ctx.destination);
        source.start();
    } catch(e) {}
}

const pianoMusic = document.getElementById('pianoMusic');
pianoMusic.volume = 0.15;

document.getElementById('soundBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
        pianoMusic.play().catch(()=>{});
        document.getElementById('soundIcon').textContent = '🔊';
        document.getElementById('soundText').textContent = 'صدا';
    } else {
        pianoMusic.pause();
        document.getElementById('soundIcon').textContent = '🔇';
        document.getElementById('soundText').textContent = 'بی‌صدا';
    }
});

document.getElementById('gpsBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    playWhoosh();
    const url = `https://www.google.com/maps/search/?api=1&query=${GPS_LAT},${GPS_LNG}`;
    window.open(url, '_blank');
});

document.getElementById('backBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    cinematicTransition('meydan-mellat');
});

document.getElementById('panorama').addEventListener('click', function() {
    if (soundEnabled && !audioStarted) {
        pianoMusic.play().catch(()=>{});
        audioStarted = true;
    }
}, { once: true });

function openLandingPage() {
    playWhoosh();
    window.open('https://dibaads.com/cooperation/#contact', '_blank');
}

// ===== ترنزیشن سینماتیک با زوم این =====
function cinematicTransition(targetSceneId) {
    if (isTransitioning) return;
    isTransitioning = true;
    
    playWhoosh();
    
    const overlay = document.getElementById('transitionOverlay');
    
    // زوم این سریع
    viewer.setZoom(100);
    
    // فید به سیاه
    setTimeout(() => {
        overlay.classList.add('active');
    }, 250);
    
    // تغییر صحنه
    setTimeout(() => {
        viewer.loadScene(targetSceneId);
    }, 700);
    
    // فید از سیاه
    setTimeout(() => {
        overlay.classList.remove('active');
    }, 1100);
    
    // زوم اوت نرم
    setTimeout(() => {
        viewer.setZoom(50);
        isTransitioning = false;
    }, 1400);
}

// ===== تعریف صحنه‌ها =====
const scenes = {
    "meydan-mellat": {
        "title": "میدان ملت",
        "type": "equirectangular",
        "panorama": "meydan-mellat.jpg",
        "hotSpots": [
            {
                "pitch": -5, "yaw": 0,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🚪 ایمپلنتکده",
                "clickHandlerFunc": function() { cinematicTransition('voroodi'); }
            },
            {
                "pitch": 5, "yaw": 90,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "️ پذیرش",
                "clickHandlerFunc": function() { cinematicTransition('paziresh'); }
            }
        ]
    },
    "voroodi": {
        "title": "ورودی ایمپلنتکده",
        "type": "equirectangular",
        "panorama": "voroodi.jpg",
        "hotSpots": [
            {
                "pitch": 0, "yaw": 180,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🔙 میدان ملت",
                "clickHandlerFunc": function() { cinematicTransition('meydan-mellat'); }
            },
            {
                "pitch": -5, "yaw": 0,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🛋️ پذیرش",
                "clickHandlerFunc": function() { cinematicTransition('paziresh'); }
            },
            {
                "pitch": 5, "yaw": -90,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🦷 اتاق یونیت",
                "clickHandlerFunc": function() { cinematicTransition('younit'); }
            }
        ]
    },
    "paziresh": {
        "title": "پذیرش",
        "type": "equirectangular",
        "panorama": "paziresh.jpg",
        "hotSpots": [
            {
                "pitch": 0, "yaw": 180,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🔙 میدان ملت",
                "clickHandlerFunc": function() { cinematicTransition('meydan-mellat'); }
            },
            {
                "pitch": -5, "yaw": 0,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🦷 اتاق یونیت",
                "clickHandlerFunc": function() { cinematicTransition('younit'); }
            },
            {
                "pitch": 0, "yaw": 90,
                "type": "info",
                "cssClass": "neon-hotspot consult",
                "text": " مشاوره رایگان",
                "clickHandlerFunc": openLandingPage
            }
        ]
    },
    "younit": {
        "title": "اتاق یونیت",
        "type": "equirectangular",
        "panorama": "younit.jpg",
        "hotSpots": [
            {
                "pitch": 0, "yaw": 180,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🔙 پذیرش",
                "clickHandlerFunc": function() { cinematicTransition('paziresh'); }
            },
            {
                "pitch": 5, "yaw": 90,
                "type": "info",
                "cssClass": "neon-hotspot",
                "text": "🚪 ورودی",
                "clickHandlerFunc": function() { cinematicTransition('voroodi'); }
            }
        ]
    }
};

const viewer = pannellum.viewer('panorama', {
    "default": {
        "firstScene": "meydan-mellat",
        "sceneFadeDuration": 1000,
        "autoLoad": true,
        "showControls": true,
        "hfov": 100,
        "minHfov": 50,
        "maxHfov": 120
    },
    "scenes": scenes
});

viewer.on('scenechange', function(sceneId) {
    document.getElementById('backBtn').style.display = sceneId !== 'meydan-mellat' ? 'flex' : 'none';
});

viewer.on('load', function() {
    document.getElementById('loading').style.display = 'none';
});

// افکت تاچ برای موبایل
document.addEventListener('touchstart', function(e) {
    if (e.target.classList.contains('neon-hotspot')) {
        e.target.classList.add('touch-active');
    }
}, { passive: true });

document.addEventListener('touchend', function(e) {
    if (e.target.classList.contains('neon-hotspot')) {
        setTimeout(() => {
            e.target.classList.remove('touch-active');
        }, 200);
    }
}, { passive: true });
</script>

</body>
</html>
